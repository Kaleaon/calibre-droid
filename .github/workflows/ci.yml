name: CI
on: [push, pull_request]
permissions:
    contents: read # to fetch code (actions/checkout)

jobs:
    test:
        name: Test on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - name: Checkout source code
              uses: actions/checkout@v3
              with:
                fetch-depth: 10
                persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                python-version: "3.10"

            - name: Install calibre dependencies
              run:
                  python setup/unix-ci.py install

            - name: Bootstrap calibre
              run:
                  python setup/unix-ci.py bootstrap

            - name: Test calibre
              env:
                PYTHONWARNINGS: error
                CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
              run:
                  python setup/unix-ci.py test

    archtest:
        name: Test on Arch
        runs-on: ubuntu-latest
        container:
            image: 'archlinux/archlinux:latest'
            env:
                CI: 'true'
        steps:
            - name: Setup container
              run: |
                pacman -Syu --noconfirm
                pacman -S --noconfirm tar

            - name: Checkout source code
              uses: actions/checkout@master
              with:
                fetch-depth: 10

            - name: Install calibre dependencies
              run: setup/arch-ci.sh

            - name: Bootstrap calibre
              run: runuser -u ci -- python setup.py bootstrap --ephemeral --debug --sanitize

            - name: Test calibre
              env:
                PYTHONWARNINGS: error
                CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
              run: |
                  set -xe
                  runuser -u ci -- python setup.py test --under-sanitize
                  echo "Running test_rs"
                  runuser -u ci -- python setup.py test_rs

    android_app:
        name: Build Android app (debug)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: "17"

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android SDK components
              run: |
                sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

            - name: Build debug APK
              working-directory: android_app
              run: |
                ./gradlew --no-daemon test assembleDebug
