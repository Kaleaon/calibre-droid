name: Android App CI

on:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/android_app_ci.yml'
  pull_request:
    paths:
      - 'android_app/**'
      - '.github/workflows/android_app_ci.yml'

permissions:
  contents: read

jobs:
  android-build:
    name: Android app checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle compile check
        run: ./gradlew app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew app:testDebugUnitTest --stacktrace
